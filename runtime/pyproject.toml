[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "linsight-runtime"
version = "0.1.0"
description = "LInsight AI Runtime and Edge Agent"
requires-python = ">=3.12,<3.14"
dependencies = [
  "aiortc>=1.14,<2",
  "cryptography>=44,<50",
  "fastapi>=0.128,<1",
  "httpx>=0.28,<1",
  "numpy>=1.26,<3",
  "onnxruntime>=1.24,<2",
  "pillow>=12,<13",
  "psutil>=7.2,<8",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.12,<3",
  "uvicorn[standard]>=0.40,<1",
  "websockets>=15,<18",
  "rknn-toolkit-lite2==2.3.2; platform_system == 'Linux' and platform_machine == 'aarch64' and python_version == '3.12'",
]

[project.optional-dependencies]
pytorch = [
  "torch>=2.6,<3",
  "ultralytics>=8.3,<9",
]
test = [
  "onnx>=1.20,<2",
  "pytest>=9,<10",
  "ruff>=0.15,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["ai_runtime", "edge_agent"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]
