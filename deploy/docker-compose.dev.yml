name: linsight-dev

services:
  mysql:
    image: mysql:8.4
    container_name: linsight-mysql
    environment:
      TZ: Asia/Shanghai
      MYSQL_DATABASE: linsight
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-linsight_dev}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --lower-case-table-names=1
    ports:
      - "${MYSQL_PORT:-23306}:3306"
    volumes:
      - linsight-mysql-data:/var/lib/mysql
      - ../backend/sql/mysql/linsight.sql:/docker-entrypoint-initdb.d/01-linsight.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: linsight-redis
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-26379}:6379"
    volumes:
      - linsight-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: linsight-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-linsight}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-linsight_minio_dev}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-29000}:9000"
      - "${MINIO_CONSOLE_PORT:-29001}:9001"
    volumes:
      - linsight-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  linsight-mysql-data:
  linsight-redis-data:
  linsight-minio-data:
